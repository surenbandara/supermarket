components:
  securitySchemes:
      BearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT 
  schemas:
    NewProduct:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
        cusine:
          type: array
          items:
            type: string
        brand:
          type: string
        shop:
          type: string
        image:
          type: string
        discount:
          type: number
        timestamp:
          type: integer
        additionalData:
          type: object
          properties:
            color:
              type: string
            expirationDate:
              type: number
            size:
              type: string
            description:
              type: string
      required:
        - name
        - price
        - quantity
        - cusine
        - brand
        - shop
        - timestamp
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
        cusine:
          type: array
          items:
            type: string
        brand:
          type: string
        shop:
          type: string
        image:
          type: string
        discount:
          type: number
        timestamp:
          type: integer
        additionalData:
          type: object
          # properties:
          #   color:
          #     type: string
          #   expirationDate:
          #     type: number
          #   size:
          #     type: string
          #   description:
          #     type: string
      required:
        - id
        - name
        - price
        - quantity
        - cusine
        - brand
        - shop
        - timestamp
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        profilePic:
          type: string
      required:
        - id
        - username
        - email
        - role
    Vendor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        shopList:
          type: array
          items:
            type: string
        timestamp:
          type: number
        image:
          type: string
        additionalData:
          type: string
      required:
        - name
        - email
        - timestamp
    Shop:
      type: object
      properties:
        name:
          type: string
        vendorName:
          type: string
        vendorEmai:
          type: string
        vendorPhoneNumber:
          type: string
        category:
          type: string
          enum:
            - super-market
            - restaurants # add more categories as needed
        timestamp:
          type: number
        image:
          type: string
        additionalData:
          type: string
      required:
        - name
        - vendorName
        - vendorEmai
        - vendorPhoneNumber
        - timestamp
    ModifiedShop:
      type: object
      properties:
        vendorName:
          type: string
        vendorEmai:
          type: string
        category:
          type: string
          enum:
            - super-market
            - restaurants # add more categories as needed
        vendorPhoneNumber:
          type: string
        timestamp:
          type: number
        image:
          type: string
        additionalData:
          type: string
      required:
        - vendorName
        - vendorEmai
        - vendorPhoneNumber
        - timestamp
    Rider:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        vehicle:
          type: string
        available:
          type: boolean
      required:
        - name
        - email
        - phoneNumber
        - vehicle
        - available
    Cusine:
      type: object
      properties:
        name:
          type: string
        timestamp:
          type: number
      required:
        - name
        - timestamp
    ModifiedCusine:
      type: object
      properties:
        name:
          type: string
        newName:
          type: string
        timestamp:
          type: number
      required:
        - name
        - timestamp
    SystemParameter:
      type: object
      properties:
        name:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
      required:
        - name
        - value    
    InitialOrder:
      type: object
      required:
        - id
        - productList
        - totalPrice
        - status
        - paymentMethod
        - paymentStatus
        - userId
        - userLocation
        - timestamp
      properties:
        id:
          type: integer
          description: Unique identifier for the order
        productList:
          type: array
          description: List of products in the order
          items:
            $ref: '#/components/schemas/PriceBag'
        totalPrice:
          $ref: '#/components/schemas/TotalBill'
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        userId:
          type: string
          description: ID of the user who placed the order
        userLocation:
          type: string
          description: Delivery location of the user
        discount:
          type: number
          format: float
          description: Discount applied to the order (if any)
        additionalNote:
          type: string
          description: Additional notes provided by the user (if any)
        timestamp:
          type: integer
          format: int64
          description: Timestamp of when the order was placed   
    Order:
      type: object
      required:
        - id
        - bill
        - totalPrice
        - status
        - paymentMethod
        - paymentStatus
        - userId
        - userLocation
        - timestamp
      properties:
        id:
          type: integer
          description: Unique identifier for the order
        bill:
          type: string
        totalPrice:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        userId:
          type: string
          description: ID of the user who placed the order
        userLocation:
          type: string
          description: Delivery location of the user
        discount:
          type: number
        additionalNote:
          type: string
          description: Additional notes provided by the user (if any)
        timestamp:
          type: integer
          description: Timestamp of when the order was placed
    OrderStatus:
      type: string
      enum:
        - NEW
        - INITIATED
        - CONFIRMED
        - PROCESSING
        - SHIPPED
        - DELIVERED
        - COMPLETED
        - CANCELLED
        - RETURNED
      description: Current status of the order
    PaymentMethod:
      type: string
      enum:
        - CASH
        - CARD
        - ONLINE
      description: Payment method used for the order
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
      description: Status of the payment
    PriceBag:
      type: object
      required:
        - productId
        - quantity
        - requestedPrice
        - truePrice
        - availableQuantity
      properties:
        productId:
          type: integer
          description: Unique identifier for the product
        quantity:
          type: integer
          description: Quantity of the product in the order
        requestedPrice:
          type: number
          format: float
          description: Price requested by the customer
        truePrice:
          type: number
          format: float
          description: Actual price of the product
        availableQuantity:
          type: number
          format: float
          description: Difference between requested price and true price
    TotalBill:
      type: object
      required:
        - totalCost
        - deliveryCost
        - loyaltyPoints
        - discount
        - payableAmount
      properties:
        totalCost:
          type: number
          format: float
          description: Total cost of goods before additional charges
        deliveryCost:
          type: number
          format: float
          description: Cost of delivery
        loyaltyPoints:
          type: number
          format: float
          description: Loyalty points deducted from total cost
        discount:
          type: number
          format: float
          description: Discount applied to the order
        payableAmount:
          type: number
          format: float
          description: Final amount payable after all adjustments

