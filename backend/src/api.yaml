  /products:
    get:
      summary: Get all products
      operationId: listProducts
      security:
        - BearerAuth: []
      x-roles: ['admin', 'user']
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      summary: Filter products
      operationId: filterProducts
      security:
        - BearerAuth: []
      x-roles: ['admin', 'user']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Filter by product name
                priceRange:
                  type: object
                  properties:
                    min:
                      type: number
                      description: Minimum price
                    max:
                      type: number
                      description: Maximum price
                quantityRange:
                  type: object
                  properties:
                    min:
                      type: number
                      description: Minimum quantity
                    max:
                      type: number
                      description: Maximum quantity
                cusine:
                  type: array
                  items:
                    type: string
                  description: Filter by cuisine types
                brand:
                  type: string
                  description: Filter by brand name
                shop:
                  type: string
                  description: Filter by shop name
                discount:
                  type: number
                  description: Filter by discount percentage
                timestampRange:
                  type: object
                  properties:
                    start:
                      type: number
                      description: Start timestamp (milliseconds)
                    end:
                      type: number
                      description: End timestamp (milliseconds)
                limit:
                  type: integer
                  description: Number of products per page
                page:
                  type: integer
                  description: Page number for pagination
      responses:
        '200':
          description: A list of filtered products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Failed to filter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
